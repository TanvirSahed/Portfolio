<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects</title>
  <link rel="stylesheet" href="projects.css" />
  <link rel="stylesheet" href="../../index.css" />
</head>
<body>
  <header class="site-header skin-projects" data-common-nav>
    <div class="nav-wrap">
      <a class="site-name" id="nav-name-left" href="../home/home.html">Tanvir Sahed</a>
      <nav class="nav" id="nav-items"></nav>
    </div>
  </header>

  <main class="page">
    <header class="page-head">
      <h1 id="page-title"></h1>
      <p id="page-subtitle"></p>
    </header>

    <div class="project-tabs-shell" id="project-tabs-shell">
      <div class="project-tabs" id="project-tabs" role="tablist"></div>
    </div>
    <section class="project-sections" id="project-sections"></section>
  </main>

  <div class="image-modal" id="image-modal" aria-hidden="true">
    <button class="image-close" id="image-close" type="button" aria-label="Close">x</button>
    <button class="image-nav prev" id="image-prev" type="button" aria-label="Previous image">‹</button>
    <button class="image-nav next" id="image-next" type="button" aria-label="Next image">›</button>
    <div class="image-frame" id="image-frame">
      <img id="image-modal-img" alt="">
      <div class="zoom-lens" id="zoom-lens" aria-hidden="true"></div>
      <p class="image-caption" id="image-modal-caption"></p>
      <span class="image-modal-counter" id="image-modal-counter"></span>
    </div>
  </div>

  <script src="../../index.js" defer data-nav-json="../../index.json"></script>
  <script src="projects.js" defer></script>
</body>
</html>
